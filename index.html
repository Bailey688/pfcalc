<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保費融資計算機</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background-color: #f4f6f9;
            color: #2d3748;
            margin: 0;
            padding: 24px;
            font-size: 15px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.05);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            color: #1a365d;
            font-weight: 800;
        }
        .btn-pdf {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.2);
        }
        .btn-pdf:hover { background-color: #c53030; }
        
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 16px;
        }
        .card-label {
            font-size: 1.05rem;
            color: #718096;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-input-wrapper {
            display: flex;
            align-items: center;
        }
        .card-input-wrapper span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a5568;
            margin-right: 5px;
        }
        .input-card input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #cbd5e0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
            outline: none;
            padding: 2px;
        }
        .input-card input:focus { border-bottom-color: #3182ce; }

        .grid-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .res-card {
            padding: 24px;
            border-radius: 18px;
            font-weight: bold;
        }
        .res-blue { background-color: #ebf8ff; border: 2px solid #bee3f8; color: #2b6cb0; }
        .res-green { background-color: #f0fff4; border: 2px solid #c6f6d5; color: #38a169; }
        .res-label { font-size: 1.15rem; margin-bottom: 6px; color: inherit; opacity: 0.9; }
        .res-value { font-size: 2.3rem; font-weight: 900; }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }
        .slider-section {
            background: #1a202c;
            color: white;
            padding: 25px;
            border-radius: 18px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .slider-wrapper input {
            width: 100%;
            cursor: pointer;
            height: 8px;
        }

        .fee-section {
            background: #2d3748;
            color: white;
            padding: 25px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .fee-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .fee-toggle-container {
            display: flex;
            background: #4a5568;
            padding: 4px;
            border-radius: 10px;
        }
        .fee-btn {
            background: transparent;
            color: #cbd5e0;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .fee-btn.active {
            background: #3182ce;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .fee-input-wrapper {
            display: flex;
            align-items: center;
            background: #1a202c;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #4a5568;
        }
        .fee-input-wrapper span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a0aec0;
            margin-right: 8px;
        }
        .fee-input-wrapper input {
            background: transparent;
            border: none;
            color: #63b3ed;
            font-size: 1.5rem;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 30px;
        }

        .csv-section {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 25px;
            border-radius: 20px;
        }
        .csv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .csv-title { font-size: 1.3rem; font-weight: bold; color: #1a365d; }
        .btn-add {
            background: #3182ce;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .csv-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7fafc;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid #edf2f7;
        }
        .csv-col { display: flex; flex-direction: column; }
        .csv-col label { font-size: 0.95rem; color: #718096; font-weight: bold; margin-bottom: 4px; }
        .csv-col div { display: flex; align-items: center; }
        .csv-input-yr { width: 55px; font-size: 1.3rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; text-align: center; color: #2b6cb0;}
        .csv-input-val { width: 130px; font-size: 1.3rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; }
        .btn-del {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #e53e3e;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            transition: all 0.2s;
        }
        .btn-del:hover { background: #e53e3e; color: white; border-color: #e53e3e; }

        /* 表格區塊優化 (精簡大氣風格) */
        .table-section {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .table-title {
            padding: 20px 25px;
            background: #f7fafc;
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 2px solid #e2e8f0;
            color: #1a365d;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        
        /* 定義每欄寬度比例 */
        th:nth-child(1), td:nth-child(1) { width: 11%; padding-left: 20px; } /* 年期 */
        th:nth-child(2), td:nth-child(2) { width: 15%; } /* 本金 */
        th:nth-child(3), td:nth-child(3) { width: 22%; } /* 總支出 */
        th:nth-child(4), td:nth-child(4) { width: 16%; } /* 現金價值 */
        th:nth-child(5), td:nth-child(5) { width: 16%; } /* 還款後價值 */
        th:nth-child(6), td:nth-child(6) { width: 20%; padding-right: 20px; } /* 回報 */

        th { 
            background: #f7fafc; 
            padding: 16px 10px; 
            font-size: 1.1rem; 
            color: #4a5568; 
            border-bottom: 2px solid #e2e8f0; 
            font-weight: bold;
        }
        td { 
            padding: 16px 10px; 
            font-size: 1.25rem; 
            border-bottom: 1px solid #edf2f7; 
            vertical-align: top;
            line-height: 1.4;
        }
        
        /* 核心精髓：微縮細字算式樣式 */
        .sub-formula {
            display: block;
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 6px;
            font-weight: normal;
        }
        
        .td-year { font-weight: bold; color: #2d3748; font-size: 1.3rem; }
        .td-main-val { font-weight: bold; color: #2d3748; }

        /* 回報欄位的細部排版 */
        .return-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .return-row-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profit-text { font-weight: bold; }
        .badge-roi {
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            color: white;
        }
        .bg-positive { background-color: #3182ce; } /* 藍色代表正回報 */
        .bg-negative { background-color: #e53e3e; } /* 紅色代表負回報 */
        
        .cagr-text {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4a5568;
        }

        .btn-arrow-toggle {
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            margin-left: auto;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .btn-pdf, .btn-add, .btn-del, .fee-toggle-container { display: none !important; }
            .csv-section { border: none; padding: 0; }
            .csv-row { border: none; background: transparent; padding: 5px 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="font-size: 2.4rem;">保費融資大字分析儀表板</h1>
        </div>
        <button class="btn-pdf" onclick="window.print()">匯出 PDF 報告</button>
    </header>

    <div class="grid-inputs">
        <div class="input-card">
            <div class="card-label">總保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="totalPremium" value="1373000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label" style="color:#2b6cb0;">折扣後保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="discountedPremium" value="1350000" oninput="calculateAll()" style="color:#2b6cb0;">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">首日退保價值</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="day1Csv" value="1100000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">融資比率 %</div>
            <div class="card-input-wrapper">
                <input type="number" id="ltvRate" value="88.1818" step="0.0001" oninput="calculateAll()"><span>%</span>
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">申請手續費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="applicationFee" value="5000" oninput="calculateAll()">
            </div>
        </div>
    </div>

    <div class="grid-results">
        <div class="res-card res-blue">
            <div class="res-label">預計貸款金額</div>
            <div class="res-value" id="lblLoanAmount">$0</div>
        </div>
        <div class="res-card res-green">
            <div class="res-label">初始投入本金</div>
            <div class="res-value" id="lblInitialPrincipal">$0</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="slider-section">
            <div class="slider-header">
                <span>貸款年利率 (Loan Interest)</span>
                <span id="lblInterestRate" style="color:#63b3ed; font-size:1.6rem;">2.7%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="interestRate" min="0" max="8" step="0.1" value="2.7" oninput="calculateAll()">
            </div>
        </div>

        <div class="fee-section">
            <div class="fee-header">
                <span>每年手續費 (Annual Service Fee)</span>
                <div class="fee-toggle-container">
                    <button id="btnFeePercent" class="fee-btn active" onclick="setFeeMode('percent')">按比例 (%)</button>
                    <button id="btnFeeFixed" class="fee-btn" onclick="setFeeMode('fixed')">固定收費 ($)</button>
                </div>
            </div>
            <div class="fee-input-wrapper">
                <span id="feeSymbol">%</span>
                <input type="number" id="annualFeeValue" value="0.0" step="0.01" oninput="calculateAll()">
                <span id="feeSuffix" style="font-size: 0.95rem; margin-left: 10px; color:#a0aec0;">of Loan Amount</span>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="csv-section">
            <div class="csv-header">
                <div class="csv-title">預期現金價值總額</div>
                <button class="btn-add" onclick="addCsvRow()">+</button>
            </div>
            <div id="csvRowsContainer"></div>
        </div>

        <div class="table-section">
            <div class="table-title">年度精簡分析明細</div>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th style="padding-left:20px;">年期</th>
                        <th>本金</th>
                        <th>總支出</th>
                        <th>現金價值</th>
                        <th>還款後價值</th>
                        <th style="padding-right:20px;">回報</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let defaultData = [
        { year: 3, csv: 1400000 },
        { year: 4, csv: 1520000 },
        { year: 5, csv: 1690000 }
    ];

    let annualFeeMode = 'percent';
    let openRows = {}; 

    function init() {
        const container = document.getElementById('csvRowsContainer');
        container.innerHTML = '';
        defaultData.forEach(item => { createRowHTML(item.year, item.csv); });
        calculateAll();
    }

    function setFeeMode(mode) {
        annualFeeMode = mode;
        const btnPercent = document.getElementById('btnFeePercent');
        const btnFixed = document.getElementById('btnFeeFixed');
        const feeSymbol = document.getElementById('feeSymbol');
        const feeSuffix = document.getElementById('feeSuffix');
        const feeInput = document.getElementById('annualFeeValue');

        if (mode === 'percent') {
            btnPercent.classList.add('active');
            btnFixed.classList.remove('active');
            feeSymbol.innerText = '%';
            feeSuffix.innerText = 'of Loan Amount';
            feeInput.value = "0.0";
        } else {
            btnPercent.classList.remove('active');
            btnFixed.classList.add('active');
            feeSymbol.innerText = '$';
            feeSuffix.innerText = '固定手續費';
            feeInput.value = "0";
        }
        calculateAll();
    }

    function addCsvRow() {
        const yrInputs = document.querySelectorAll('.csv-input-yr');
        let nextYear = 1;
        if(yrInputs.length > 0) {
            const years = Array.from(yrInputs).map(input => parseInt(input.value) || 0);
            nextYear = Math.max(...years) + 1;
        }
        createRowHTML(nextYear, 0);
        calculateAll();
    }

    function createRowHTML(year, csv) {
        const container = document.getElementById('csvRowsContainer');
        const row = document.createElement('div');
        row.className = 'csv-row';
        row.innerHTML = `
            <div class="csv-col">
                <label>年期</label>
                <div>
                    <input type="number" class="csv-input-yr" value="${year}" oninput="calculateAll()">
                    <span style="font-size:1.1rem; color:#718096; font-weight:bold; margin-left:2px;">年</span>
                </div>
            </div>
            <div class="csv-col" style="flex:1; margin-left:10px;">
                <label>預期價值 ($)</label>
                <div>
                    <span style="font-size:1.2rem; color:#718096; font-weight:bold; margin-right:4px;">$</span>
                    <input type="number" class="csv-input-val" value="${csv}" oninput="calculateAll()">
                </div>
            </div>
            <button class="btn-del" onclick="deleteRow(this)">🗑️</button>
        `;
        container.appendChild(row);
    }

    function deleteRow(button) {
        button.parentElement.remove();
        calculateAll();
    }

    function formatWan(val) { 
        return (val / 10000).toFixed(1) + '萬'; 
    }

    function toggleRowArrow(year) {
        const arrow = document.getElementById(`arrow-${year}`);
        if (!arrow) return;
        if (openRows[year]) {
            arrow.innerText = '︿';
            openRows[year] = false;
        } else {
            arrow.innerText = '﹀';
            openRows[year] = true;
        }
    }

    function calculateAll() {
        const totalPremium = parseFloat(document.getElementById('totalPremium').value) || 0;
        const discountedPremium = parseFloat(document.getElementById('discountedPremium').value) || 0;
        const day1Csv = parseFloat(document.getElementById('day1Csv').value) || 0;
        const ltvRate = parseFloat(document.getElementById('ltvRate').value) || 0;
        const applicationFee = parseFloat(document.getElementById('applicationFee').value) || 0;
        const interestRate = parseFloat(document.getElementById('interestRate').value) || 0;
        const annualFeeValue = parseFloat(document.getElementById('annualFeeValue').value) || 0;

        document.getElementById('lblInterestRate').innerText = interestRate + '%';

        // 核心貸款與本金計算
        const loanAmount = day1Csv * (ltvRate / 100);
        const initialPrincipal = discountedPremium - loanAmount + applicationFee;

        document.getElementById('lblLoanAmount').innerText = '$' + Math.round(loanAmount).toLocaleString();
        document.getElementById('lblInitialPrincipal').innerText = '$' + Math.round(initialPrincipal).toLocaleString();

        const yrInputs = document.querySelectorAll('.csv-input-yr');
        const valInputs = document.querySelectorAll('.csv-input-val');
        let rowsData = [];

        for(let i=0; i<yrInputs.length; i++) {
            let y = parseInt(yrInputs[i].value) || 0;
            let c = parseFloat(valInputs[i].value) || 0;
            rowsData.push({ year: y, csv: c });
        }

        rowsData.sort((a, b) => a.year - b.year);

        const tbody = document.getElementById('resultTableBody');
        tbody.innerHTML = '';

        rowsData.forEach(row => {
            if(row.year <= 0) return;

            // 1. 持有成本計算
            const annualInterest = loanAmount * (interestRate / 100);
            const annualServiceFee = annualFeeMode === 'percent' ? loanAmount * (annualFeeValue / 100) : annualFeeValue;
            const annualCost = annualInterest + annualServiceFee;
            
            // 累計總支出
            const cumulativeCost = annualCost * row.year;
            
            // 2. 還款後價值
            const valueAfterRepay = row.csv - loanAmount;
            
            // 3. 回報與利潤
            const netProfit = valueAfterRepay - initialPrincipal - cumulativeCost;
            const returnRate = (netProfit / (initialPrincipal || 1)) * 100;
            
            // 4. 年化收益率 (CAGR) 計算公式
            // 公式: ((還款後價值 / (初始本金 + 累計支出)) ^ (1/年期)) - 1
            // 另一種對標圖中演算法：以初始投入本金與最終淨資產關係推算
            let cagr = 0;
            if (valueAfterRepay > 0 && initialPrincipal > 0) {
                // 對標圖中的實算年化 (以總回報率推算年化)
                cagr = (Math.pow(1 + (returnRate / 100), 1 / row.year) - 1) * 100;
            }

            if (!openRows.hasOwnProperty(row.year)) {
                openRows[row.year] = false; 
            }

            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.onclick = () => toggleRowArrow(row.year);
            
            // 字串格式化處理（用於微縮算式顯示）
            const loanWan = (loanAmount / 10000).toFixed(1);
            const csvWan = (row.csv / 10000).toFixed(1);
            const principalWan = (initialPrincipal / 10000).toFixed(1);

            tr.innerHTML = `
                <td class="td-year">${row.year}</td>
                <td class="td-main-val">${formatWan(initialPrincipal)}</td>
                <td>
                    <span class="td-main-val">${formatWan(cumulativeCost)}</span>
                    <span class="sub-formula">${loanWan}萬 x ${interestRate}% x ${row.year}</span>
                </td>
                <td class="td-main-val">${formatWan(row.csv)}</td>
                <td>
                    <span class="td-main-val">${formatWan(valueAfterRepay)}</span>
                    <span class="sub-formula">${csvWan}萬 - ${loanWan}萬</span>
                </td>
                <td>
                    <div class="return-container">
                        <div class="return-row-top">
                            <span class="profit-text" style="color: ${netProfit >= 0 ? '#2b6cb0' : '#e53e3e'}">
                                ${netProfit >= 0 ? '' : ''}${formatWan(netProfit)}
                            </span>
                            <span class="badge-roi ${returnRate >= 0 ? 'bg-positive' : 'bg-negative'}">
                                ${returnRate >= 0 ? '+' : ''}${returnRate.toFixed(2)}%
                            </span>
                            <button class="btn-arrow-toggle" id="arrow-${row.year}">︿</button>
                        </div>
                        <div class="cagr-text">
                            *年化收益: ${cagr >= 0 ? '' : ''}${cagr.toFixed(2)}%
                        </div>
                        <span class="sub-formula" style="font-size:0.78rem; letter-spacing:-0.2px;">
                            (${csvWan}萬 - ${principalWan}萬 - ${loanWan}萬 - 總支出) / ${principalWan}萬
                        </span>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保費融資計算機</title>
    <style>
        /* ==========================================================================
           1. 網頁畫面（螢幕顯示）原生樣式
           ========================================================================== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background-color: #f4f6f9;
            color: #2d3748;
            margin: 0;
            padding: 24px;
            font-size: 15px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.05);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            color: #1a365d;
            font-weight: 800;
        }
        .btn-pdf {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.2);
        }
        .btn-pdf:hover { background-color: #c53030; }
        
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 16px;
        }
        .card-label {
            font-size: 1.05rem;
            color: #718096;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-input-wrapper {
            display: flex;
            align-items: center;
        }
        .card-input-wrapper span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a5568;
            margin-right: 5px;
        }
        .input-card input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #cbd5e0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
            outline: none;
            padding: 2px;
        }
        .input-card input:focus { border-bottom-color: #3182ce; }

        .grid-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .res-card {
            padding: 24px;
            border-radius: 18px;
            font-weight: bold;
        }
        .res-blue { background-color: #ebf8ff; border: 2px solid #bee3f8; color: #2b6cb0; }
        .res-green { background-color: #f0fff4; border: 2px solid #c6f6d5; color: #38a169; }
        .res-label { font-size: 1.15rem; margin-bottom: 6px; color: inherit; opacity: 0.9; }
        .res-value { font-size: 2.3rem; font-weight: 900; }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }
        .slider-section {
            background: #1a202c;
            color: white;
            padding: 25px;
            border-radius: 18px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .slider-wrapper input {
            width: 100%;
            cursor: pointer;
            height: 8px;
        }

        .fee-section {
            background: #2d3748;
            color: white;
            padding: 25px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .fee-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .fee-toggle-container {
            display: flex;
            background: #4a5568;
            padding: 4px;
            border-radius: 10px;
        }
        .fee-btn {
            background: transparent;
            color: #cbd5e0;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .fee-btn.active {
            background: #3182ce;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .fee-input-wrapper {
            display: flex;
            align-items: center;
            background: #1a202c;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #4a5568;
        }
        .fee-input-wrapper span:first-child {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a0aec0;
            margin-right: 8px;
            white-space: nowrap;
        }
        .fee-input-wrapper input {
            background: transparent;
            border: none;
            color: #63b3ed;
            font-size: 1.5rem;
            font-weight: bold;
            width: 100%;
            outline: none;
        }
        .fee-small-text {
            font-size: 0.75rem; 
            margin-left: 8px; 
            color: #718096;
            font-weight: normal;
            white-space: nowrap; 
            display: inline-block;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 30px;
        }

        .csv-section {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 25px;
            border-radius: 20px;
        }
        .csv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .csv-title { font-size: 1.3rem; font-weight: bold; color: #1a365d; }
        .btn-add {
            background: #3182ce;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .csv-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #f7fafc;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid #edf2f7;
        }
        .csv-col { display: flex; flex-direction: column; }
        .csv-col label { font-size: 0.9rem; color: #718096; font-weight: bold; margin-bottom: 4px; }
        .csv-col div { display: flex; align-items: center; }
        .csv-input-yr { width: 45px; font-size: 1.2rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; text-align: center; color: #2b6cb0;}
        .csv-input-val { width: 105px; font-size: 1.2rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; }
        
        .unfunded-roi-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a5568;
            background: #edf2f7;
            padding: 4px 8px;
            border-radius: 6px;
            text-align: center;
            min-width: 65px;
            display: inline-block;
        }

        .btn-del {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #e53e3e;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            margin-left: auto;
            transition: all 0.2s;
        }
        .btn-del:hover { background: #e53e3e; color: white; border-color: #e53e3e; }

        .table-section {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .table-title {
            padding: 20px 25px;
            background: #f7fafc;
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 2px solid #e2e8f0;
            color: #1a365d;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        
        th:nth-child(1), td:nth-child(1) { width: 10%; padding-left: 20px; } 
        th:nth-child(2), td:nth-child(2) { width: 13%; } 
        th:nth-child(3), td:nth-child(3) { width: 18%; } 
        th:nth-child(4), td:nth-child(4) { width: 14%; } 
        th:nth-child(5), td:nth-child(5) { width: 15%; } 
        th:nth-child(6), td:nth-child(6) { width: 30%; padding-right: 20px; } 

        th { 
            background: #f7fafc; 
            padding: 16px 10px; 
            font-size: 1.1rem; 
            color: #4a5568; 
            border-bottom: 2px solid #e2e8f0; 
            font-weight: bold;
        }
        td { 
            padding: 16px 10px; 
            font-size: 1.25rem; 
            border-bottom: 1px solid #edf2f7; 
            vertical-align: top;
            line-height: 1.4;
        }
        
        .sub-formula {
            display: none;
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 6px;
            font-weight: normal;
        }
        .sub-formula.show-calc { display: block; }
        
        .td-year { font-weight: bold; color: #2d3748; font-size: 1.3rem; }
        .td-main-val { font-weight: bold; color: #2d3748; }

        .return-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .return-row-top { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-wrap: nowrap; }
        .profit-text { font-weight: bold; white-space: nowrap; }
        .badge-roi { padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; color: white; white-space: nowrap; }
        
        .bg-positive { background-color: #38a169; } 
        .bg-negative { background-color: #e53e3e; } 
        .cagr-text { font-size: 0.95rem; font-weight: bold; color: #4a5568; white-space: nowrap; }
        .btn-arrow-toggle { background: none; border: none; color: #a0aec0; cursor: pointer; font-size: 0.9rem; padding: 0; margin-left: auto; }

        /* ==========================================================================
           2. ⚡ 核心修復：列印專用樣式（強制 A4 橫向、隱藏動態控制、抹除算式）
           ========================================================================== */
        @media print {
            @page {
                size: A4 landscape;
                margin: 6mm 8mm;
            }
            body { 
                background: white; 
                padding: 0; 
                font-size: 10pt;
                line-height: 1.2;
            }
            .container { 
                box-shadow: none; 
                padding: 0; 
                max-width: 100% !important;
                width: 100% !important;
            }
            /* 隱藏網頁上才需要的互動按鈕、控制台與摺疊箭頭 */
            .btn-pdf, .btn-add, .btn-del, .btn-arrow-toggle, .fee-toggle-container, .control-panel { 
                display: none !important; 
            }
            /* 修正輸入欄位：移除網頁底線，改為乾淨的列印報告框線 */
            .input-card {
                border: 1px solid #cbd5e0 !important;
                padding: 8px !important;
                background: #f7fafc !important;
            }
            .input-card input {
                border: none !important;
                background: transparent !important;
                font-size: 11pt !important;
            }
            .grid-inputs {
                gap: 10px !important;
                margin-bottom: 15px !important;
            }
            .grid-results {
                margin-bottom: 15px !important;
                gap: 15px !important;
            }
            .res-card { padding: 12px 18px !important; }
            .res-value { font-size: 18pt !important; }

            /* 💡 修正表格佈局：將 Grid 改為 Table 渲染，避免左右區塊往下掉 */
            .main-layout {
                display: table !important;
                width: 100% !important;
            }
            .csv-section {
                display: table-cell !important;
                width: 28% !important;
                vertical-align: top !important;
                padding: 12px !important;
                border: 1px solid #e2e8f0 !important;
            }
            .table-section {
                display: table-cell !important;
                width: 72% !important;
                vertical-align: top !important;
                border: 1px solid #e2e8f0 !important;
                padding-left: 15px !important;
            }
            .csv-row {
                background: #f7fafc !important;
                border: 1px solid #edf2f7 !important;
                padding: 6px !important;
                margin-bottom: 6px !important;
            }
            .csv-input-yr, .csv-input-val {
                border: none !important;
                font-size: 10pt !important;
                background: transparent !important;
            }
            .table-title {
                padding: 8px 15px !important;
                font-size: 11pt !important;
            }
            th { padding: 6px 4px !important; font-size: 9.5pt !important; }
            td { padding: 8px 4px !important; font-size: 10pt !important; }
            
            /* 💡 嚴格修正：PDF 內無論如何一律抹除、隱藏詳細算式，保持清爽 */
            .sub-formula { 
                display: none !important; 
            }
            .return-row-top { white-space: nowrap !important; }
            .badge-roi { padding: 2px 5px !important; font-size: 8.5pt !important; }
            .cagr-text { font-size: 8.5pt !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="font-size: 2.4rem;">保費融資計算機</h1>
        </div>
        <button class="btn-pdf" onclick="window.print()">匯出 PDF 報告</button>
    </header>

    <div class="grid-inputs">
        <div class="input-card">
            <div class="card-label">總保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="totalPremium" value="1373000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label" style="color:#2b6cb0;">折扣後保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="discountedPremium" value="1350000" oninput="calculateAll()" style="color:#2b6cb0;">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">首日退保價值</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="day1Csv" value="1100000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">融資比率 %</div>
            <div class="card-input-wrapper">
                <input type="number" id="ltvRate" value="80" step="0.0001" oninput="calculateAll()"><span>%</span>
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">申請手續費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="applicationFee" value="5000" oninput="calculateAll()">
            </div>
        </div>
    </div>

    <div class="grid-results">
        <div class="res-card res-blue">
            <div class="res-label">預計貸款金額</div>
            <div class="res-value" id="lblLoanAmount">$0</div>
        </div>
        <div class="res-card res-green">
            <div class="res-label">初始投入本金</div>
            <div class="res-value" id="lblInitialPrincipal">$0</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="slider-section">
            <div class="slider-header">
                <span>貸款年利率</span>
                <span id="lblInterestRate" style="color:#63b3ed; font-size:1.6rem;">2.7%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="interestRate" min="0" max="8" step="0.1" value="2.7" oninput="calculateAll()">
            </div>
        </div>

        <div class="fee-section">
            <div class="fee-header">
                <span>每年手續費</span>
                <div class="fee-toggle-container">
                    <button id="btnFeePercent" class="fee-btn active" onclick="setFeeMode('percent')">按比例 (%)</button>
                    <button id="btnFeeFixed" class="fee-btn" onclick="setFeeMode('fixed')">固定收費 ($)</button>
                </div>
            </div>
            <div class="fee-input-wrapper">
                <span id="feeSymbol">%</span>
                <input type="number" id="annualFeeValue" value="0.0" step="0.01" oninput="calculateAll()">
                <span id="feeSuffix" class="fee-small-text">貸款額</span>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="csv-section">
            <div class="csv-header">
                <div class="csv-title">預期現金價值總額</div>
                <button class="btn-add" onclick="addCsvRow()">+</button>
            </div>
            <div id="csvRowsContainer"></div>
        </div>

        <div class="table-section">
            <div class="table-title">年度分析明細</div>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th style="padding-left:20px;">年期</th>
                        <th>本金</th>
                        <th>總支出</th>
                        <th>現金價值</th>
                        <th>還款後價值</th>
                        <th style="padding-right:20px;">回報</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let defaultData = [
        { year: 3, csv: 1400000 },
        { year: 4, csv: 1520000 },
        { year: 5, csv: 1690000 }
    ];

    let annualFeeMode = 'percent';
    let openCalculations = {}; 

    function init() {
        const container = document.getElementById('csvRowsContainer');
        container.innerHTML = '';
        defaultData.forEach(item => { createRowHTML(item.year, item.csv); });
        calculateAll();
    }

    function

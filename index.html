<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保費融資計算機</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background-color: #f4f6f9;
            color: #2d3748;
            margin: 0;
            padding: 24px;
            font-size: 12px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.05);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-b: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #edf2f7;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            color: #1a365d;
            font-weight: 800;
        }
        .btn-pdf {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-pdf:hover { background-color: #2c5282; }
        
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 16px;
        }
        .card-label {
            font-size: 1rem;
            color: #718096;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-input-wrapper {
            display: flex;
            align-items: center;
        }
        .card-input-wrapper span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a5568;
            margin-right: 5px;
        }
        .input-card input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #cbd5e0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #2d3748;
            outline: none;
            padding: 2px;
        }
        .input-card input:focus { border-bottom-color: #3182ce; }

        .grid-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .res-card {
            padding: 24px;
            border-radius: 18px;
            font-weight: bold;
        }
        .res-blue { background-color: #ebf8ff; border: 2px solid #bee3f8; color: #2b6cb0; }
        .res-green { background-color: #f0fff4; border: 2px solid #c6f6d5; color: #38a169; }
        .res-label { font-size: 1.1rem; margin-bottom: 6px; color: inherit; opacity: 0.9; }
        .res-value { font-size: 2.2rem; font-weight: 900; }

        .slider-section {
            background: #1a202c;
            color: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 35px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .slider-wrapper input {
            width: 100%;
            cursor: pointer;
            height: 8px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .csv-section {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 25px;
            border-radius: 20px;
        }
        .csv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .csv-title { font-size: 1.3rem; font-weight: bold; color: #1a365d; }
        .btn-add {
            background: #3182ce;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .csv-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7fafc;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid #edf2f7;
        }
        .csv-col { display: flex; flex-direction: column; }
        .csv-col label { font-size: 0.9rem; color: #718096; font-weight: bold; margin-bottom: 4px; }
        .csv-col div { display: flex; align-items: center; }
        .csv-input-yr { width: 55px; font-size: 1.2rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; text-align: center; color: #2b6cb0;}
        .csv-input-val { width: 120px; font-size: 1.2rem; font-weight: bold; border: none; border-bottom: 2px solid #cbd5e0; background: transparent; }
        .btn-del {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 1.3rem;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto;
            padding: 5px;
        }
        .btn-del:hover { color: #c53030; }

        .table-section {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .table-title {
            padding: 20px 25px;
            background: #f7fafc;
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 2px solid #e2e8f0;
            color: #1a365d;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f7fafc; padding: 18px 25px; font-size: 1.05rem; color: #4a5568; border-bottom: 2px solid #e2e8f0; }
        td { padding: 22px 25px; font-size: 1.2rem; border-bottom: 1px solid #edf2f7; }
        .td-year { font-weight: 900; color: #2b6cb0; font-size: 1.3rem; }
        .td-cost { color: #e53e3e; font-weight: bold; }
        .td-value { font-weight: 900; color: #2d3748; }
        
        .badge-positive { background-color: #c6f6d5; color: #22543d; padding: 8px 14px; border-radius: 10px; font-weight: bold; }
        .badge-negative { background-color: #fed7d7; color: #742a2a; padding: 8px 14px; border-radius: 10px; font-weight: bold; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .btn-pdf, .btn-add, .btn-del { display: none !important; }
            .csv-section { border: none; padding: 0; }
            .csv-row { border: none; background: transparent; padding: 5px 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>保費融資大字分析儀表板</h1>
        </div>
        <button class="btn-pdf" onclick="window.print()">匯出 PDF 報告</button>
    </header>

    <div class="grid-inputs">
        <div class="input-card">
            <div class="card-label">總保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="totalPremium" value="1373000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label" style="color:#2b6cb0;">折扣後保費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="discountedPremium" value="1350000" oninput="calculateAll()" style="color:#2b6cb0;">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">首日退保價值</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="day1Csv" value="1100000" oninput="calculateAll()">
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">融資比率 %</div>
            <div class="card-input-wrapper">
                <input type="number" id="ltvRate" value="90" oninput="calculateAll()"><span>%</span>
            </div>
        </div>
        <div class="input-card">
            <div class="card-label">申請手續費</div>
            <div class="card-input-wrapper">
                <span>$</span><input type="number" id="applicationFee" value="5000" oninput="calculateAll()">
            </div>
        </div>
    </div>

    <div class="grid-results">
        <div class="res-card res-blue">
            <div class="res-label">預計貸款金額</div>
            <div class="res-value" id="lblLoanAmount">$0</div>
        </div>
        <div class="res-card res-green">
            <div class="res-label">初始投入本金</div>
            <div class="res-value" id="lblInitialPrincipal">$0</div>
        </div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>貸款年利率 (Loan Interest)</span>
            <span id="lblInterestRate" style="color:#63b3ed; font-size:1.6rem;">2.7%</span>
        </div>
        <div class="slider-wrapper">
            <input type="range" id="interestRate" min="0" max="8" step="0.1" value="2.7" oninput="calculateAll()">
        </div>
    </div>

    <div class="main-layout">
        <div class="csv-section">
            <div class="csv-header">
                <div class="csv-title">預期現金價值總額</div>
                <button class="btn-add" onclick="addCsvRow()">+</button>
            </div>
            <div id="csvRowsContainer"></div>
        </div>

        <div class="table-section">
            <div class="table-title">年度分析明細</div>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th style="padding-left:25px;">持有年期</th>
                        <th>累計成本</th>
                        <th>還款後價值</th>
                        <th style="text-align:right; padding-right:25px;">槓桿回報率 %</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let defaultData = [
        { year: 3, csv: 1420000 },
        { year: 5, csv: 1689727 },
        { year: 8, csv: 1850000 },
        { year: 10, csv: 2003704 }
    ];

    function init() {
        const container = document.getElementById('csvRowsContainer');
        container.innerHTML = '';
        defaultData.forEach(item => { createRowHTML(item.year, item.csv); });
        calculateAll();
    }

    function addCsvRow() {
        createRowHTML(1, 0);
        calculateAll();
    }

    function createRowHTML(year, csv) {
        const container = document.getElementById('csvRowsContainer');
        const row = document.createElement('div');
        row.className = 'csv-row';
        row.innerHTML = `
            <div class="csv-col">
                <label>年期</label>
                <div>
                    <input type="number" class="csv-input-yr" value="${year}" oninput="calculateAll()">
                    <span style="font-size:1rem; color:#718096; font-weight:bold; margin-left:2px;">年</span>
                </div>
            </div>
            <div class="csv-col" style="flex:1; margin-left:10px;">
                <label>預期價值 ($)</label>
                <div>
                    <span style="font-size:1.1rem; color:#718096; font-weight:bold; margin-right:4px;">$</span>
                    <input type="number" class="csv-input-val" value="${csv}" oninput="calculateAll()">
                </div>
            </div>
            <button class="btn-del" onclick="deleteRow(this)">🗑️</button>
        `;
        container.appendChild(row);
    }

    function deleteRow(button) {
        button.parentElement.remove();
        calculateAll();
    }

    function formatWan(val) { return (val / 10000).toFixed(1) + ' 萬'; }

    function calculateAll() {
        const totalPremium = parseFloat(document.getElementById('totalPremium').value) || 0;
        const discountedPremium = parseFloat(document.getElementById('discountedPremium').value) || 0;
        const day1Csv = parseFloat(document.getElementById('day1Csv').value) || 0;
        const ltvRate = parseFloat(document.getElementById('ltvRate').value) || 0;
        const applicationFee = parseFloat(document.getElementById('applicationFee').value) || 0;
        const interestRate = parseFloat(document.getElementById('interestRate').value) || 0;

        document.getElementById('lblInterestRate').innerText = interestRate + '%';

        const loanAmount = day1Csv * (ltvRate / 100);
        const initialPrincipal = discountedPremium - loanAmount + applicationFee;

        document.getElementById('lblLoanAmount').innerText = '$' + Math.round(loanAmount).toLocaleString();
        document.getElementById('lblInitialPrincipal').innerText = '$' + Math.round(initialPrincipal).toLocaleString();

        const yrInputs = document.querySelectorAll('.csv-input-yr');
        const valInputs = document.querySelectorAll('.csv-input-val');
        let rowsData = [];

        for(let i=0; i<yrInputs.length; i++) {
            let y = parseInt(yrInputs[i].value) || 0;
            let c = parseFloat(valInputs[i].value) || 0;
            rowsData.push({ year: y, csv: c });
        }

        rowsData.sort((a, b) => a.year - b.year);

        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = '';

        rowsData.forEach(row => {
            if(row.year <= 0) return;
            const annualCost = loanAmount * (interestRate / 100) + (loanAmount * 0.001); 
            const cumulativeCost = annualCost * row.year;
            const valueAfterRepay = row.csv - loanAmount;
            const netProfit = valueAfterRepay - initialPrincipal - cumulativeCost;
            const returnRate = (netProfit / (initialPrincipal || 1)) * 100;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="td-year" style="padding-left:25px;">${row.year} 年</td>
                <td class="td-cost">${formatWan(cumulativeCost)}</td>
                <td class="td-value">${formatWan(valueAfterRepay)}</td>
                <td style="text-align:right; padding-right:25px;">
                    <span class="${returnRate >= 0 ? 'badge-positive' : 'badge-negative'}">
                        ${returnRate >= 0 ? '+' : ''}${returnRate.toFixed(1)}%
                    </span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    init();
</script>
</body>
</html>
